# ====================================================================
# 单独 nginx 服务 compose（多实例部署场景）
# 多实例部署时 nginx 独立运行，做负载均衡分发到多个 app 实例
# 使用（从项目根运行）：docker compose -f docker/compose/docker-compose.nginx.yml up -d
# 前置：多个 app 实例已通过 docker-compose.app.yml 部署（scale 或独立容器）
#
# 配置选择：
#   - 默认挂载 ../nginx/conf.d/ 目录（含 default.conf，upstream 指向 app:3000）
#   - 多实例负载均衡：在 ../nginx/conf.d/ 下放 upstream-balanced.conf 覆盖 upstream，
#     或直接编辑 default.conf 的 upstream 块加多个 server
# ====================================================================
services:
  nginx:
    image: nginx:alpine
    container_name: nuxt-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
