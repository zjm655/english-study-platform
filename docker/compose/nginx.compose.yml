# ====================================================================
# 机器 A nginx 网关 compose（跨机四实例负载均衡）
# 对外暴露 80 端口，反向代理到 4 个 Nuxt 实例：
#   机器 A 2 实例（NODE_A_IP:3001/3002）+ 机器 B 2 实例（NODE_B_IP:3001/3002）
# 使用（机器 A，从项目根运行）：
#   $env:NODE_A_IP='10.0.0.1'; $env:NODE_B_IP='10.0.0.2';
#   docker compose -f docker/compose/nginx.compose.yml up -d
#
# 渲染机制：NODE_A_IP/NODE_B_IP 经 environment 注入容器环境变量，
#   command 用 nginx:alpine 自带的 envsubst（显式变量清单，只替换这两个 IP，
#   保护 $host/$remote_addr 等 nginx 内建变量）把 multi-node-upstream.conf.template
#   渲染为同目录 multi-node-upstream.conf（nginx 自动 include /etc/nginx/conf.d/*.conf）。
#
# 资源：memory 128M / cpus 0.25。
#
# !!! 一致性约束（重要）：
# 部署时在机器 A 使用本 compose + multi-node-upstream.conf.template（自动渲染为
# multi-node-upstream.conf），不再启用 default.conf 的同名 upstream —— 两文件同时定义
# upstream nuxt_app 会启动失败（nginx 重复定义 upstream 报错）。
# 若宿主机 conf.d 目录同时含 default.conf，需先重命名/移走再启动本 compose。
#
# 挂载说明（与 docker-compose.yml 的 :ro 不同）：本 compose 将 conf.d 以读写方式挂载，
#   因为 command 需在容器内把渲染后的 .conf 写入该目录；:ro 挂载下该写入会失败（EROFS）。
# ====================================================================
services:
  nginx:
    image: nginx:alpine
    container_name: nuxt-nginx
    restart: unless-stopped
    environment:
      # 机器 A/B 内网 IP，供 envsubst 渲染模板（对应 .template 中的 ${NODE_A_IP}/${NODE_B_IP}）
      NODE_A_IP: ${NODE_A_IP}
      NODE_B_IP: ${NODE_B_IP}
    # 启动前渲染模板：显式变量清单 '$$NODE_A_IP $$NODE_B_IP'（compose 的 $$ 转义为 $），
    # 只替换这两个 IP，其余 nginx 内建变量（$host 等）原样保留
    command: /bin/sh -c "envsubst '$$NODE_A_IP $$NODE_B_IP' < /etc/nginx/conf.d/multi-node-upstream.conf.template > /etc/nginx/conf.d/multi-node-upstream.conf && nginx -g 'daemon off;'"
    volumes:
      # 读写挂载（见头注释：envsubst 需写入渲染产物；部署时需移走 default.conf 避免 upstream 冲突）
      - ../nginx/conf.d:/etc/nginx/conf.d
    ports:
      - '80:80'
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
