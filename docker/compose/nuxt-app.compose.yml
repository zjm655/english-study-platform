# ====================================================================
# 多机多实例 app compose（机器 A/B 各起 2 实例，共 4 个 Nuxt 实例）
# 基于 ACR runner 镜像 pull：服务器不做本地构建，镜像在构建机 build 后 push 到 ACR，
# 此处仅从 ACR 拉取（image 固定 ACR 仓库地址，仅 IMAGE_TAG 每次发版变化）。
# 每实例映射内网端口 3001/3002（供跨机 nginx 负载均衡：NODE_A_IP:3001/3002 + NODE_B_IP:3001/3002）；
# 端口只绑内网 IP（NODE_LOCAL_IP），不映射公网，仅内网可达。
# 使用（在目标机器 A/B 上，从项目根运行）：
#   docker compose -f docker/compose/nuxt-app.compose.yml up -d
# 前置：
#   1) 复制 docker/env/.env.app.example -> .env.app 并填值（.env.app 被 gitignore，含 DB/Redis 密码等敏感项）
#   2) 插值变量（compose 的 ${} 只从 shell 环境变量或 --env-file 读取，不读 .env.app）：
#      IMAGE_TAG —— 镜像版本 tag，每次发版必填（缺失时 compose 直接报错，防忘填拉错）；
#          shell export 或一行 --env-file 传入即可（如 export IMAGE_TAG=v1.1.0）。
#      NODE_A_IP      —— 机器 A 内网 IP（运行 Redis 6379）
#      NODE_B_IP      —— 机器 B 内网 IP（运行 MySQL 3307 宿主映射端口）
#      NODE_LOCAL_IP  —— 本机内网 IP（当前机器 A 或 B，端口绑定地址）
#      例（PowerShell）：$env:IMAGE_TAG='v1.1.0'; $env:NODE_A_IP='10.0.0.1'; $env:NODE_B_IP='10.0.0.2';
#                        $env:NODE_LOCAL_IP='10.0.0.1'; docker compose -f docker/compose/nuxt-app.compose.yml up -d
# 说明：不设 container_name——同机两个服务由 compose 自动生成唯一名，两台机器可同时部署互不冲突；
#       不用 replicas 缩扩（避免同机端口 3001/3002 冲突），显式两个服务 app-1/app-2 各绑一个端口。
# ====================================================================
services:
  app-1:
    image: crpi-sxzt8kc60va1i0tz.cn-hangzhou.personal.cr.aliyuncs.com/aliyun-docker-zjm655/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      # 业务配置唯一事实源（含 NUXT_DB_PASSWORD / NUXT_REDIS_PASSWORD 等密码项）
      - ../env/.env.app
    environment:
      # 内网接线覆盖（environment 优先级高于 env_file）：
      # DB 在机器 B（NODE_B_IP）、Redis 在机器 A（NODE_A_IP）；密码类不从这覆盖，走 .env.app
      NUXT_DB_HOST: ${NODE_B_IP}
      NUXT_DB_PORT: '3307'
      NUXT_REDIS_HOST: ${NODE_A_IP}
      NUXT_REDIS_PORT: '6380'
    ports:
      # 仅内网可达：本机内网 IP:3001 -> 容器 3000
      - '${NODE_LOCAL_IP}:3001:3000'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 健康检查：探测静态资源（public/robots.txt 静态直出不触发 SSR——探测 / 会渲染首页，
    # SSR 内部调用需鉴权 API 产生 401 埋点噪音，见 2026-08-21 排查）
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

  app-2:
    image: crpi-sxzt8kc60va1i0tz.cn-hangzhou.personal.cr.aliyuncs.com/aliyun-docker-zjm655/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.app
    environment:
      # 内网接线覆盖（environment 优先级高于 env_file）：
      # DB 在机器 B（NODE_B_IP）、Redis 在机器 A（NODE_A_IP）；密码类不从这覆盖，走 .env.app
      NUXT_DB_HOST: ${NODE_B_IP}
      NUXT_DB_PORT: '3307'
      NUXT_REDIS_HOST: ${NODE_A_IP}
      NUXT_REDIS_PORT: '6380'
    ports:
      # 仅内网可达：本机内网 IP:3002 -> 容器 3000
      - '${NODE_LOCAL_IP}:3002:3000'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 健康检查：探测静态资源（public/robots.txt 静态直出不触发 SSR——探测 / 会渲染首页，
    # SSR 内部调用需鉴权 API 产生 401 埋点噪音，见 2026-08-21 排查）
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

# 无需共享卷（app 无状态，仅连外部 MySQL/Redis）
networks:
  app-net:
    driver: bridge
