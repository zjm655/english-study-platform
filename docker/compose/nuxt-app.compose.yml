# ====================================================================
# 每机 app compose（机器 A/B/C... 各跑一份）：本机 2 个 Nuxt 实例
# 基于 ACR runner 镜像 pull：服务器不做本地构建，镜像在构建机 build 后 push 到 ACR，
# 此处仅从 ACR 拉取（image 固定 ACR 仓库地址，仅 IMAGE_TAG 每次发版变化）。
# 职责划分（2026-08-21 解耦集群机器）：
#   - compose 只描述本机栈：2 实例 + 宿主端口 3001/3002（全接口绑定）
#   - 端口安全由宿主机防火墙/云安全组控制（仅放行入口层来源 IP 的 3001/3002）
#   - 跨机入口/负载均衡由宿主机全局 nginx（宝塔）负责：加机器只改宝塔 upstream/DNS，本文件零改动
#   - DB/Redis 地址由 .env.app 直接填写（不注入任何机器 IP 变量）
# 使用（在目标机器上，从项目根运行）：
#   export IMAGE_TAG=v1.1.0
#   docker compose -f docker/compose/nuxt-app.compose.yml up -d
# 前置：
#   1) 复制 docker/env/.env.app.example -> .env.app 并填值（含 NUXT_DB_HOST/PORT、NUXT_REDIS_HOST/PORT 等全部连接信息）
# 说明：不设 container_name——同机两个服务由 compose 自动生成唯一名，多台机器可同时部署互不冲突；
#       不用 replicas 缩扩（避免同机端口 3001/3002 冲突），显式两个服务 app-1/app-2 各绑一个端口。
# ====================================================================
services:
  app-1:
    image: crpi-sxzt8kc60va1i0tz.cn-hangzhou.personal.cr.aliyuncs.com/aliyun-docker-zjm655/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      # 业务配置唯一事实源（含 NUXT_DB_HOST/PORT/PASSWORD、NUXT_REDIS_HOST/PORT/PASSWORD 等全部连接信息）
      # 注意：NUXT_DB_PORT 须为宿主机映射端口 3307，NUXT_REDIS_PORT 须为宿主机映射端口 6380
      - ../env/.env.app
    ports:
      # 本机栈实例端口：3001/3002 全接口绑定（容器内 3000）
      # 安全边界：由宿主机防火墙/云安全组控制——仅放行入口层（全局 nginx/宝塔）来源 IP 的 3001/3002
      - '3001:3000'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 健康检查：探测静态资源（public/robots.txt 静态直出不触发 SSR——探测 / 会渲染首页，
    # SSR 内部调用需鉴权 API 产生 401 埋点噪音，见 2026-08-21 排查）
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

  app-2:
    image: crpi-sxzt8kc60va1i0tz.cn-hangzhou.personal.cr.aliyuncs.com/aliyun-docker-zjm655/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.app
    ports:
      # 本机栈实例端口：3002 全接口绑定（容器内 3000），防火墙白名单同 app-1
      - '3002:3000'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 健康检查：探测静态资源（public/robots.txt 静态直出不触发 SSR——探测 / 会渲染首页，
    # SSR 内部调用需鉴权 API 产生 401 埋点噪音，见 2026-08-21 排查）
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

# 无需共享卷（app 无状态，仅连外部 MySQL/Redis）
networks:
  app-net:
    driver: bridge
