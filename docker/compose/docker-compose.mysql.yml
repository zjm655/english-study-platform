# ====================================================================
# 单独 mysql 服务 compose（多实例部署场景）
# 多实例部署时 db 独立运行，供多个 app 实例共享连接
# 含 migrate 服务：部署 db 后自动执行迁移，跑完退出
# 使用（从项目根运行）：docker compose -f docker/compose/docker-compose.mysql.yml up -d
# 前置：复制 docker/env/.env.migrate.example -> .env.migrate 并填值（migrate 配置，NUXT_DB_HOST 指向本 db）；
#       复制 docker/env/.env.mysql.example -> .env.mysql 并填值（mysql 完整配置）
# 部署后 app 用 docker-compose.app.yml 连接（NUXT_DB_HOST 指向本 mysql 容器地址）
# ====================================================================
services:
  # ------------------------------------------------------------------
  # migrate: 数据库迁移一次性任务（基于 builder target，含完整源码 + tsx）
  # 等数据库健康后执行 npm run migrate，跑完即退（restart: "no"）
  # ------------------------------------------------------------------
  migrate:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: migrator
    container_name: nuxt-migrate
    restart: 'no'
    env_file:
      - ../env/.env.migrate
    environment:
      # 覆盖为容器间服务名（compose 网络内 db 即 mysql 容器）
      NUXT_DB_HOST: db
      NUXT_DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: nuxt-mysql
    restart: unless-stopped
    env_file:
      - ../env/.env.mysql
    environment:
      # 时区对齐宿主机：mysql 镜像默认 UTC，datetime 默认值 CURRENT_TIMESTAMP 会写 UTC 时间，
      # 与迁移/应用（本地时区）写入的数据相差 8 小时，造成全库时间口径错位
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    # 不映射端口到宿主机：app 通过 compose 子网 db:3306 访问，避免与本机 mysql 冲突
    # 如需外部访问，临时加 ports: - "3307:3306"
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

volumes:
  mysql-data:

networks:
  app-net:
    driver: bridge
