# ====================================================================
# 本机栈 compose（每台机器各跑一份）：nginx + 本机 2 个 Nuxt 实例
# 主推形态（2026-08-20）：
#   - nginx 与本机 app-1/app-2 同 compose 网络 app-net，nginx 用容器名 app-1/app-2:3000
#     访问本机实例（无需端口映射，nuxt 不暴露任何端口，纯内网）
#   - nginx 对外暴露宿主 5555（本机栈唯一对外口，全接口绑定），转发到本机 2 实例
# 职责划分（2026-08-21 解耦集群机器）：compose 不感知机器 IP——
#   - 5555 端口安全由宿主机防火墙/云安全组控制（仅放行入口层来源 IP）
#   - 跨机入口/负载均衡由宿主机全局 nginx（宝塔）负责：upstream/proxy_pass 指向各机 5555，
#     加机器只改宝塔配置或 DNS，本文件零改动
# 使用（在目标机器上，从项目根运行）：
#   docker compose -f docker/compose/local-stack.compose.yml up -d
# 前置：
#   1) 复制 docker/env/.env.app.example -> .env.app 并填值（业务配置 + DB/Redis 密码）
#   2) 插值变量（compose 的 ${} 只从 shell / --env-file 读，不读 .env.app）：
#      IMAGE_TAG —— 镜像版本 tag，每次发版必填（缺失时 compose 直接报错，防忘填拉错）；
#          shell export 或一行 --env-file 传入即可（如 export IMAGE_TAG=v1.1.0）。
#   3) DB/Redis 连接信息由 .env.app 直接填写（不再被 compose 覆盖）：
#      NUXT_DB_HOST=DB机内网IP、NUXT_DB_PORT=3307（宿主机映射端口）
#      NUXT_REDIS_HOST=Redis机内网IP、NUXT_REDIS_PORT=6380（宿主机映射端口）
# 数据库/Redis 分机：DB 机跑 mariadb.compose.yml、Redis 机跑 docker-compose.redis.yml
#   （均映射宿主机内网 IP:3307 / :6380），app 在 .env.app 里直写对端内网 IP 跨机访问。
# ====================================================================
services:
  # ------------------------------------------------------------------
  # nginx：本机负载均衡网关，暴露内网 5555 -> 转发本机 app-1/app-2
  # 只挂载 local-app-upstream.conf（单文件），避免 default.conf 的 upstream 冲突
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nuxt-nginx
    restart: unless-stopped
    # 关键：删除镜像内置 default.conf（欢迎页）——它监听 80 且字母序排在 local-app-upstream.conf
    # 之前，两文件同时监听 80 时请求会打到欢迎页导致代理不生效
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ../nginx/conf.d/local-app-upstream.conf:/etc/nginx/conf.d/local-app-upstream.conf:ro
    ports:
      # 本机栈对外口：5555 全接口绑定 -> 容器 80（安全边界由宿主机防火墙/云安全组控制，仅放行入口层来源 IP）
      - '5555:80'
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      - app-net

  # ------------------------------------------------------------------
  # app-1 / app-2：本机两个 Nuxt 实例（ACR runner 镜像 pull，无端口映射，纯内网）
  # 不设 container_name——同机两个服务由 compose 自动生成唯一名，两台机器不冲突
  # ------------------------------------------------------------------
  app-1:
    image: crpi-sxzt8kc60va1i0tz.cn-hangzhou.personal.cr.aliyuncs.com/aliyun-docker-zjm655/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      # 业务配置唯一事实源（含 NUXT_DB_HOST/PORT/PASSWORD、NUXT_REDIS_HOST/PORT/PASSWORD 等全部连接信息）
      # 注意：NUXT_DB_PORT 须为宿主机映射端口 3307，NUXT_REDIS_PORT 须为宿主机映射端口 6380
      #       （两中间件映射端口已错开，与 mariadb/redis compose 定义一致）
      - ../env/.env.app
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 健康检查：探测静态资源（public/robots.txt 静态直出不触发 SSR——探测 / 会渲染首页，
    # SSR 内部调用需鉴权 API 产生 401 埋点噪音，见 2026-08-21 排查）
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

  app-2:
    image: crpi-sxzt8kc60va1i0tz.cn-hangzhou.personal.cr.aliyuncs.com/aliyun-docker-zjm655/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.app
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 健康检查：探测静态资源（public/robots.txt 静态直出不触发 SSR，见 app-1 注释）
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

# 无需共享卷（app 无状态，仅连外部 MariaDB/Redis）
networks:
  app-net:
    driver: bridge
