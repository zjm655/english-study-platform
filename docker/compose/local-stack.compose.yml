# ====================================================================
# 本机栈 compose（机器 A/B 各跑一份）：nginx + 本机 2 个 Nuxt 实例
# 新架构主推（2026-08-20）：
#   - nginx 与本机 app-1/app-2 同 compose 网络 app-net，nginx 用容器名 app-1/app-2:3000
#     访问本机实例（无需端口映射，nuxt 不暴露任何端口，纯内网）
#   - nginx 对外暴露本机内网 IP:5555（本机栈唯一对外口），转发到本机 2 实例
#   - 两台机器都跑本文件；入口层（大概率单机入口 nginx）再转发到两台内网 5555
# 说明：本层（nginx 转发本机 2 实例）不受入口方案影响；入口层方案决定 5555 的
#   暴露范围——单机入口：绑内网（本配置默认，${NODE_LOCAL_IP}:5555:80，仅入口可达）；
#   若改 DNS 轮询需公网暴露，把 ports 改为 '5555:80'（并确保该机已 ICP 备案）。
# 使用（在目标机器 A/B 上，从项目根运行）：
#   docker compose --env-file ../env/.env.acr -f docker/compose/local-stack.compose.yml up -d
# 前置：
#   1) 复制 docker/env/.env.app.example -> .env.app 并填值（业务配置 + DB/Redis 密码）
#   2) 插值变量（compose 的 ${} 只从 shell / --env-file 读，不读 .env.app）经 .env.acr 传入：
#      ACR_REGISTRY / ACR_NAMESPACE / IMAGE_TAG（app 镜像）
#      NODE_LOCAL_IP（本机内网 IP，nginx 5555 端口绑定地址）
#   3) DB/Redis 连接信息由 .env.app 直接填写（不再被 compose 覆盖）：
#      NUXT_DB_HOST=机器B内网IP、NUXT_DB_PORT=3307（宿主机映射端口）
#      NUXT_REDIS_HOST=机器A内网IP、NUXT_REDIS_PORT=6380（宿主机映射端口）
# 数据库/Redis 分机：机器 B 跑 mariadb.compose.yml、机器 A 跑 docker-compose.redis.yml
#   （均映射宿主机内网 IP:3307 / :6380），app 在 .env.app 里直写对端内网 IP 跨机访问。
# ====================================================================
services:
  # ------------------------------------------------------------------
  # nginx：本机负载均衡网关，暴露内网 5555 -> 转发本机 app-1/app-2
  # 只挂载 local-app-upstream.conf（单文件），避免 default.conf 的 upstream 冲突
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nuxt-nginx
    restart: unless-stopped
    # 关键：删除镜像内置 default.conf（欢迎页）——它监听 80 且字母序排在 local-app-upstream.conf
    # 之前，两文件同时监听 80 时请求会打到欢迎页导致代理不生效
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ../nginx/conf.d/local-app-upstream.conf:/etc/nginx/conf.d/local-app-upstream.conf:ro
    ports:
      # 本机栈对外口：内网 IP:5555 -> 容器 80（单机入口方案默认；DNS 轮询改 '5555:80'）
      - '${NODE_LOCAL_IP}:5555:80'
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      - app-net

  # ------------------------------------------------------------------
  # app-1 / app-2：本机两个 Nuxt 实例（ACR runner 镜像 pull，无端口映射，纯内网）
  # 不设 container_name——同机两个服务由 compose 自动生成唯一名，两台机器不冲突
  # ------------------------------------------------------------------
  app-1:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      # 业务配置唯一事实源（含 NUXT_DB_HOST/PORT/PASSWORD、NUXT_REDIS_HOST/PORT/PASSWORD 等全部连接信息）
      # 注意：NUXT_DB_PORT 须为宿主机映射端口 3307，NUXT_REDIS_PORT 须为宿主机映射端口 6380
      #       （两中间件映射端口已错开，与 mariadb/redis compose 定义一致）
      - ../env/.env.app
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 健康检查对齐 Dockerfile runner 目标（alpine wget 探测 /）
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

  app-2:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/english-platform:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.app
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

# 无需共享卷（app 无状态，仅连外部 MariaDB/Redis）
networks:
  app-net:
    driver: bridge
