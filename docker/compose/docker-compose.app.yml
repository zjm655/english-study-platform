# ====================================================================
# 单独 app 服务 compose（多实例部署场景）
# 多实例部署时 app 独立运行，连接外部 mysql/redis（不在此文件启动 db）
# 适合水平扩展：多副本 app 共用同一外部数据库
# 使用（从项目根运行）：docker compose -f docker/compose/docker-compose.app.yml up -d
# 前置：复制 docker/env/.env.app.example -> .env.app 并填值（NUXT_DB_HOST 指向外部 db）
# 注意：此文件不含 migrate 服务，需先用 docker-compose.mysql.yml 部署 db 并单独执行迁移：
#       docker compose -f docker/compose/docker-compose.mysql.yml run --rm migrate
#       （或在外部 db 上手动 npm run migrate）
# ====================================================================
services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runner
    container_name: nuxt-app
    restart: unless-stopped
    env_file:
      - ../env/.env.app
    environment:
      # 多实例部署时 DB_HOST 从 .env 读取，连接外部 mysql
      NUXT_DB_HOST: ${NUXT_DB_HOST}
    ports:
      - "3000:3000"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
