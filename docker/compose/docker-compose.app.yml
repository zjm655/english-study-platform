# ====================================================================
# 单独 app 服务 compose（多实例部署场景）
# 多实例部署时 app 独立运行，连接外部 mysql（不在此文件启动 db）
# 适合水平扩展：多副本 app 共用同一外部数据库
# 使用（从项目根运行）：docker compose -f docker/compose/docker-compose.app.yml up -d --scale app=3
# 前置：复制 docker/env/.env.app.example -> .env.app 并填值（NUXT_DB_HOST 指向外部 db）
# 注意：此文件不含 migrate 服务，需先用 docker-compose.mysql.yml 部署 db 并单独执行迁移：
#       docker compose -f docker/compose/docker-compose.mysql.yml run --rm migrate
#       （或在外部 db 上手动 npm run migrate）
# 注意：不要在此设置 container_name——多副本 scale 场景容器名必须唯一，
#       固定名会导致 compose scale 失败（与主栈 docker-compose.yml 互斥，勿同时部署）
# ====================================================================
services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      # 配置唯一事实源：NUXT_DB_HOST 在 .env.app 中指向外部 db（无需 environment 插值——
      # compose 的 ${} 从运行目录读取且优先级高于 env_file，会覆盖 env_file 的值）
      - ../env/.env.app
    ports:
      - '3000:3000'
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
