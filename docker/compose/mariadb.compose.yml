# ====================================================================
# 机器 B 独立 MariaDB 服务 compose（多机部署用）
# 双机拓扑：A = nginx + redis + nuxt×2，B = mariadb + nuxt×2，A↔B 内网互通
# 本文件在机器 B 上单独拉起数据库，app 经 NUXT_DB_HOST=机器B内网IP 访问
# 低内存配置适配 2G 机器（128M buffer pool / 50 连接 / 关闭 performance_schema）
# 使用（从项目根运行）：docker compose -f docker/compose/mariadb.compose.yml up -d
# 前置：复制 docker/env/.env.mariadb.example -> .env.mariadb 并填值（含 MARIADB_BIND_IP=机器B内网IP）
# ====================================================================
# 迁移联动说明（机器 B 执行迁移）：
# - 迁移在机器 B 上执行（migrator 容器或 npm run migrate）
# - app/migrate 的 NUXT_DB_HOST 指向本机内网 IP（即 MARIADB_BIND_IP）
# - NUXT_DB_COLLATION 必须设 utf8mb4_unicode_ci —— MariaDB 不支持 utf8mb4_0900_ai_ci
# 注意：ports 里的 ${MARIADB_BIND_IP} 由 compose 在解析期插值（读 shell 环境变量 /
#       --env-file 指定的文件），env_file 只注入容器环境、不参与插值；若该变量缺失，
#       端口会退化为绑定 0.0.0.0 全接口（仅内网约束失效），故运行前须先 export
#       MARIADB_BIND_IP（或用 --env-file docker/env/.env.mariadb 方式启动）。
# ====================================================================
services:
  # ------------------------------------------------------------------
  # db: MariaDB 10.11 数据库
  # 配置自包含于 .env.mariadb（基础设施独立，不依赖 app 的 .env）
  # env_file 注入 MARIADB_* 变量，mariadb 镜像直接读取初始化
  # 单实例部署，container_name 固定为 nuxt-mariadb 便于运维识别
  # ------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: nuxt-mariadb
    restart: unless-stopped
    env_file:
      - ../env/.env.mariadb
    # 低内存参数（2G 机器友好）：
    # --innodb-buffer-pool-size=134217728   128M 缓冲池（默认 128M，显式声明便于调整）
    # --max-connections=50                  连接数收紧，防内存超限
    # --performance-schema=OFF              关闭性能库，省 300M+ 内存
    # --character-set-server=utf8mb4 / --collation-server=utf8mb4_unicode_ci
    #   对齐应用 NUXT_DB_COLLATION（MariaDB 不支持 utf8mb4_0900_ai_ci，须用 unicode_ci）
    command:
      - mysqld
      - --innodb-buffer-pool-size=134217728
      - --max-connections=50
      - --performance-schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 仅绑定机器 B 内网 IP 的 3307 端口（错开标准 3306 防占用/降扫描噪音），A 机 nuxt 经该内网 IP 访问；
    # 仅内网可达、不映射公网（MARIADB_BIND_IP 取自 .env.mariadb）；容器内仍 3306
    ports:
      - '${MARIADB_BIND_IP}:3307:3306'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - mariadb-data:/var/lib/mysql
    # 健康检查：mariadb-admin ping 带 root 密码验证，返回 alive 视为健康（对齐旧 mysql 风格）
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

volumes:
  mariadb-data:

networks:
  app-net:
    driver: bridge
