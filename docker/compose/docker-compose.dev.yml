# ====================================================================
# 开发模式 compose：migrate(一次性) + app(dev) + db
# 启动顺序：db 健康 -> migrate 跑完退出 -> app(dev) 启动
# 源码通过 volume 挂载到容器内实现热重载，node_modules 用匿名卷隔离
# 使用（从项目根运行）：docker compose -f docker/compose/docker-compose.dev.yml up
# 前置：复制根目录 .env.example -> .env 并填值（app 配置，NUXT_DB_* 需与 .env.mysql 一致）；
#       复制 docker/env/.env.mysql.example -> .env.mysql 并填值（mysql 独立配置）
# ====================================================================
services:
  # ------------------------------------------------------------------
  # migrate: 数据库迁移一次性任务（基于 builder target，含 tsx + 源码）
  # 注意：dev 模式下 migrate 镜像构建时会 COPY 源码，但运行时源码已固定在镜像内，
  # 不随宿主热重载变更；如需重跑迁移，docker compose up --force-recreate migrate
  # ------------------------------------------------------------------
  migrate:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: migrator
    container_name: nuxt-migrate-dev
    restart: "no"
    env_file:
      - ../../.env
    environment:
      # 覆盖为容器间服务名（compose 网络内 db 即 mysql 容器）
      NUXT_DB_HOST: db
      NUXT_DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  # ------------------------------------------------------------------
  # app: Nuxt 开发服务（Dockerfile dev target）
  # 源码挂载 ../../:/app 实现热重载；/app/node_modules 匿名卷隔离宿主依赖
  # 等迁移完成后启动
  # ------------------------------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: nuxt-app-dev
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # 覆盖为容器间服务名（compose 网络内 db 即 mysql 容器）
      NUXT_DB_HOST: db
      NUXT_DB_PORT: 3306
    volumes:
      # 源码挂载（从 docker/compose/ 到项目根是两级 ../../）
      - ../../:/app
      # 匿名卷隔离 node_modules，避免宿主覆盖容器内 npm ci 装好的依赖
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-net

  # ------------------------------------------------------------------
  # db: MySQL 8.0 数据库（开发环境，独立数据卷）
  # 配置自包含于 .env.mysql（基础设施独立，不依赖 app 的 .env）
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: nuxt-mysql-dev
    restart: unless-stopped
    env_file:
      - ../env/.env.mysql
    volumes:
      - mysql-data-dev:/var/lib/mysql
    # 开发模式映射到宿主机 3307（避免与本机 3306 的 mysql 冲突），方便 GUI 工具调试
    # 生产环境（docker-compose.yml）不映射端口，只在子网内通信
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

volumes:
  mysql-data-dev:

networks:
  app-net:
    driver: bridge
