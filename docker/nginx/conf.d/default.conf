# ====================================================================
# Nginx 反向代理配置（单实例默认）
# 挂载方式：compose 把整个 docker/nginx/conf.d/ 目录挂载到 /etc/nginx/conf.d/
# nginx 官方镜像默认 include /etc/nginx/conf.d/*.conf，新增规则只需在此目录加 .conf 文件
#
# 扩展规则：在 docker/nginx/conf.d/ 下新增 *.conf 文件即可，无需改本文件
#   - 例：001-https.conf（HTTPS）、002-static.conf（静态资源）、003-logging.conf（日志格式）
# 多实例负载均衡：用 docker/nginx/upstream-balanced.conf 替换本文件的 upstream 块
# ====================================================================

# 上游应用服务（单实例默认指向 compose 服务名 app:3000）
upstream nuxt_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://nuxt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # P3-A：覆盖（而非追加）X-Forwarded-For 为可信对端 $remote_addr——
        # $proxy_add_x_forwarded_for 会把客户端伪造的 XFF 排链首，h3 取链首导致 IP 限流可伪造绕过
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（评测 SDK 等可能用到）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 超时设置（评测/上传等长连接场景）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
