# ====================================================================
# 本机 nginx 负载均衡配置（每台机器用同一份）
# 用途：转发到「本机」两个 Nuxt 实例（同 compose 网络，容器名 app-1/app-2:3000）
#   - 不依赖任何 IP：nginx 与本机 app 在同一 compose 项目/网络，直接用服务名解析
#   - 两台机器 A/B 各自跑 local-stack.compose.yml，nginx 只转发本机 2 实例
#   - 本机 nginx 对外暴露 5555（由 compose 映射），作为本机栈的唯一对外口
#     （入口层/负载均衡再转发到两台机器的 5555——本层不受入口方案影响）
# 挂载方式：local-stack.compose.yml 只挂载本文件（单文件），不挂整个 conf.d，
#   避免与 default.conf 的 upstream nuxt_app 重复定义导致 nginx 启动失败。
# ====================================================================

# 上游：本机两个 Nuxt 实例（默认轮询 + 被动健康检查，max_fails=3 摘除 30s 恢复探测）
upstream nuxt_app {
    server app-1:3000 max_fails=3 fail_timeout=30s;
    server app-2:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://nuxt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # P3-A：覆盖（而非追加）X-Forwarded-For 为可信对端 $remote_addr——
        # $proxy_add_x_forwarded_for 会把客户端伪造的 XFF 排链首，h3 取链首导致 IP 限流可伪造绕过
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（评测 SDK 等可能用到）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 超时设置（评测/上传等长连接场景）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
