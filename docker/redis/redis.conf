# ====================================================================
# Redis 容器配置文件（非敏感固定配置）
# 依据：Redis 引入方案（.agents/docs/2026-08-18-redis-design-plan.md）D15 / D16
#
# 重要说明：
# - 本文件仅包含 Redis 的非敏感固定配置，**不含任何密码 / requirepass 行**。
# - 访问密码由 docker compose 的 command 通过 --requirepass $REDIS_PASSWORD
#   从 .env.redis 注入（容器内 shell 经 $$ 转义展开），密码不落 conf，不入库。
# - 数据目录 /data 由 compose 数据卷 redis-data 挂载持久化。
# - 启用方式：在 compose 中通过 volume 挂载本文件为 /usr/local/etc/redis/redis.conf，
#   并以 redis-server /usr/local/etc/redis/redis.conf 启动。
# ====================================================================

# 监听端口（默认 6379，compose 端口映射一致）
port 6379

# RDB 持久化：1 小时内 ≥1 次写入变更才生成快照
# 来源：Redis 方案 D15 —— 生产采用 RDB 快照，不上 AOF
save 3600 1

# 禁用 AOF 持久化（D15：RDB 快照即足够，避免双写开销）
appendonly no

# 显式内存上限（D16）
maxmemory 256mb

# 内存淘汰策略：volatile-lru（D16：只淘汰带 TTL 的键，
# 配合 redisKey() 构造器 + 写入必带 TTL 的约束使用）
maxmemory-policy volatile-lru

# 数据目录（配合 compose 数据卷 redis-data:/data 持久化 RDB 快照）
dir /data
