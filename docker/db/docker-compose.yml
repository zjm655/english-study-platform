# ====================================================================
# MariaDB 10.11 数据库 compose（DB 机部署；低内存配置适配 2G 机器）
# 端口宿主映射 3307（容器内 3306，全接口绑定——安全由云防火墙白名单控制，仅放行对端内网 IP 的 3307）
# NUXT_DB_COLLATION 须 utf8mb4_unicode_ci（MariaDB 不支持 0900_ai_ci）
# 使用：docker compose -f docker/compose/mariadb.compose.yml up -d
# 前置：复制 docker/env/.env.mariadb.example -> .env.mariadb 并填值
# 迁移：在 DB 机执行（migrator 容器或 npm run migrate，NUXT_DB_HOST 指向本机内网 IP）
# ====================================================================
services:
  # db：MariaDB 10.11（配置自包含于 .env.mariadb；单实例，container_name 固定）
  db:
    image: mariadb:10.11
    container_name: nuxt-mariadb
    restart: unless-stopped
    env_file:
      - ../env/.env.mariadb
    # 低内存参数（2G 机器友好）：
    # --innodb-buffer-pool-size=134217728   128M 缓冲池（默认 128M，显式声明便于调整）
    # --max-connections=50                  连接数收紧，防内存超限
    # --performance-schema=OFF              关闭性能库，省 300M+ 内存
    # --character-set-server=utf8mb4 / --collation-server=utf8mb4_unicode_ci
    #   对齐应用 NUXT_DB_COLLATION（MariaDB 不支持 utf8mb4_0900_ai_ci，须用 unicode_ci）
    command:
      - mysqld
      - --innodb-buffer-pool-size=134217728
      - --max-connections=50
      - --performance-schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 宿主机映射 3307（错开标准 3306 防占用/降扫描噪音），容器内仍 3306；
    # 公网可达性由云防火墙/安全组控制：仅放行对端内网 IP 的 3307，其余全拒
    ports:
      - '3307:3306'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - mariadb-data:/var/lib/mysql
    # 健康检查：mariadb-admin ping 带 root 密码验证，返回 alive 视为健康（对齐旧 mysql 风格）
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

volumes:
  mariadb-data:

networks:
  app-net:
    driver: bridge
